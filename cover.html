            transition: opacity 1.4s ease-out;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            var band = document.querySelector('.dai-xanh');
            var paper = document.querySelector('.paper');
            var silk = document.querySelector('.bg');

            if (band) {

                band.style.cursor = 'pointer';

                band.addEventListener('click', function (event) {

                    // ==============================================
                    // NGĂN LINK LADI PAGE CŨ
                    // Không cho mở nawngs.com khi bấm vào bìa
                    // ==============================================
                    event.preventDefault();
                    event.stopPropagation();


                    // ==============================================
                    // 1. Dải xanh chạy xuống
                    // ==============================================
                    band.style.transform = 'translateY(100%)';
                    band.style.opacity = '0';


                    // ==============================================
                    // 2. Tờ giấy trắng chạy lên
                    // ==============================================
                    if (paper) {
                        paper.style.transform = 'translateY(-100%)';
                        paper.style.opacity = '0';
                    }


                    // ==============================================
                    // 3. Nền lụa mờ dần
                    // ==============================================
                    if (silk) {
                        silk.style.opacity = '0';
                    }


                    // ==============================================
                    // 4. Báo cho index.html mở inside.html
                    // ==============================================
                    setTimeout(function () {

                        window.parent.postMessage(
                            {
                                type: 'OPEN_INVITATION'
                            },
                            '*'
                        );

                    }, 10);

                });

            }

        });
    </script>

    <script>
        /* =====================================================
         * API THIỆP CƯỚI
         * Lấy thông tin khách từ Google Sheets
         * ===================================================== */

        const API_URL =
            'https://script.google.com/macros/s/AKfycbze8zlXBPNZy_qfemB8BV3YOVC7Phn_BMCACGcd9hnluMmmkaBER2OmZ2qUPKMaPznxPw/exec';


        /* =====================================================
         * 1. LẤY MÃ KHÁCH TỪ URL
         *
         * Ví dụ:
         * index.html?guest=KH001
         *
         * => guestId = KH001
         * ===================================================== */

        const params = new URLSearchParams(window.location.search);

        const guestId = params.get('guest');


        /* =====================================================
         * 2. GỌI API
         * ===================================================== */

        async function loadGuest() {

            // Không có mã khách
            if (!guestId) {
                console.log('Không có mã khách trong URL');
                return;
            }

            try {

                console.log('Đang lấy thông tin khách:', guestId);

                const url =
                    API_URL +
                    '?action=getGuest&id=' +
                    encodeURIComponent(guestId);

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(
                        'API HTTP error: ' + response.status
                    );
                }

                const data = await response.json();

                console.log('Dữ liệu khách nhận được:', data);


                /* =================================================
                 * 3. KIỂM TRA KẾT QUẢ API
                 * ================================================= */

                if (!data.success) {

                    console.error(
                        'Không tìm thấy khách:',
                        data.message
                    );

                    return;
                }


                /* =================================================
                 * 4. LẤY THÔNG TIN KHÁCH
                 * ================================================= */

                const guest = data.data;

                console.log('ID:', guest.id);
                console.log('Họ tên:', guest.hoTen);
                console.log('Xưng hô:', guest.xungHo);
                console.log('Lời mời:', guest.loiMoi);
                window.COVER_GUEST = guest;

                /* =================================================
                 * 5. TẠM HIỂN THỊ RA CONSOLE
                 *
                 * CHƯA sửa giao diện LadiPage ở bước này.
                 * ================================================= */

                console.log(
                    'Khách:',
                    guest.loiMoi,
                    guest.xungHo,
                    guest.hoTen
                );

            } catch (error) {

                console.error(
                    'Lỗi gọi API khách:',
                    error
                );

            }
        }


        /* =====================================================
         * 6. CHẠY
         * ===================================================== */

        loadGuest();

    </script>
